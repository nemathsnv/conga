<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Native refined — Recording</title>

</head>
<body>
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
.glass{background:rgba(28,28,30,0.38);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:0.5px solid rgba(255,255,255,0.18)}
.tool{width:44px;height:44px;border-radius:22px;border:none;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0;font:600 13px -apple-system,'SF Pro Text',sans-serif}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
<img src="img/rec_full.jpg" alt="Front camera preview" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; object-fit: cover; object-position: 50% 40%">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 240px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0))"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.45))"></div>

<header style="position: absolute; left: 12px; right: 12px; top: 50px; height: 44px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.html" aria-label="Cancel" class="tool glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<div style="height: 30px; padding: 0 12px; border-radius: 15px; background: #FF3B30; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FFFFFF"></span>0:12</div>
<button aria-label="Flip camera" class="tool glass"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"></path><path d="M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"></path><path d="M4 20v-4.5h4.5"></path></svg></button>
</header>

<div class="glass" style="position: absolute; left: 50%; top: 108px; transform: translateX(-50%); width: 300px; box-sizing: border-box; border-radius: 16px; padding: 10px 16px 11px; text-align: center">
<div style="font: 600 17px -apple-system, 'SF Pro Display', sans-serif; letter-spacing: -0.3px; line-height: 1.25">Be honest about the place you live.</div>
<div style="margin-top: 3px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.82)">Responding · up to 30 seconds</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 46px; display: flex; align-items: center; justify-content: center; gap: 46px">
<button aria-label="Light" class="tool glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 3 6 13.5h5.5L10 21l7.5-11H12z"></path></svg></button>
<a href="R-Record.html" aria-label="Stop recording, 12 of 30 seconds" style="width: 84px; height: 84px; position: relative; display: flex; align-items: center; justify-content: center">
<svg width="84" height="84" viewBox="0 0 84 84" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="42" cy="42" r="39.5" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="3.5"></circle><circle cx="42" cy="42" r="39.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="99.3 248.2" transform="rotate(-90 42 42)" stroke-linecap="round"></circle></svg>
<span style="width: 30px; height: 30px; border-radius: 8px; background: #FF3B30"></span>
</a>
<button aria-label="Zoom 1x" class="tool glass">1×</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.72); font-variant-numeric: tabular-nums">Up to 0:30</div>
</div>
</body>
</html>
